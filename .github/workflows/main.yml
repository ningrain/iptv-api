name: 'Update schedule'

# ⚠️注意：原项目提示不要在 fork 的仓库中添加 `on: schedule` 定时任务（cron）。
# Forks 可能被大量复制并触发定时执行，当前 GitHub Actions 资源使用已接近上限，
# 大量 fork 的定时任务可能导致工作流被禁用。
#
# 此处已按需求添加了每日定时任务（个人使用通常没有问题）。
# 若工作流被 GitHub 因资源限制禁用，请前往 Actions 页面重新启用，或手动点击 Run workflow。
#
# ⚠️NOTICE: The original project advises against adding `on: schedule` cron triggers in forks.
# A daily schedule is enabled here for personal use. If GitHub disables this workflow due to
# resource limits, re-enable it in the Actions tab or trigger it manually.

on:
  schedule:
    # 每天 12:15（北京时间，UTC+8）自动更新一次直播源
    # Daily 12:15 Beijing time (UTC+8)
    - cron: '15 4 * * *'
  workflow_dispatch:

jobs:
  push:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ 'ubuntu-latest' ]
    steps:
      - name: Set branch name
        id: vars
        run: echo "BRANCH_NAME=${{ github.repository_owner == 'Guovin' && 'gd' || 'master' }}" >> $GITHUB_ENV
      - uses: actions/checkout@v3
        with:
          ref: ${{ env.BRANCH_NAME }}
      - name: Run with setup-python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          update-environment: true
          cache: 'pipenv'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install pipenv
        run: pip3 install --user pipenv
      - name: Install dependecies
        run: pipenv --python 3.13 && pipenv install --deploy
      - name: Update
        run: pipenv run dev
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Github Action Auto Updated"
            git push --force
          fi
